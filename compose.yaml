services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: commerceos-backend

    ports:
      - '5000:5000'

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine

    container_name: commerceos-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commerceos

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d commerceos']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
